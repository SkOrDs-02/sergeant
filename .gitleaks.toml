# Конфіг gitleaks для pre-commit (`scripts/pre-commit-gitleaks.mjs`) і для ручних сканів.
#
# Базовий набір правил лишається як є; нижче тільки allowlist під класи фальшивих
# спрацювань, заміряних 2026-09-23 (64 знахідки в дереві, справжніх секретів нуль).
#
# Правило `generic-api-key` реагує на будь-яку константу зі словом KEY у назві, а так
# у Sergeant названі ключі localStorage та IndexedDB: NUTRITION_PANTRIES_KEY,
# MEASUREMENTS_STORAGE_KEY, ROUTINE_HABITS_KEY. Їхні значення це рядки виду
# "routine_habits_v1" або "routine/reminders/schedule", секретом вони не є.
#
# УВАГА на форму правила: `allowlist.regexes` матчиться проти ЗНАЙДЕНОГО СЕКРЕТУ,
# а не проти рядка коду. Шаблон, написаний під рядок ("_KEY = ..."), мовчки не
# спрацює, і скан лишиться червоним без пояснення.
#
# Шаблон нижче навмисно вимагає роздільник `_` або `/` усередині значення: справжні
# токени (32-символьний hex, base64) роздільників не мають, тож під виняток не
# потрапляють. Додавати сюди виняток для НЕ тестового файлу - привід зупинитись
# і перевірити значення руками, а не розширювати allowlist.

[extend]
useDefault = true

[allowlist]
description = "Тестові фікстури, ключі локального сховища і манифести дашбордів"
paths = [
  '''.*\.test\.(ts|tsx|js|mjs)$''',
  '''.*\.spec\.(ts|tsx|js|mjs)$''',
  '''.*/__tests__/.*''',
  '''.*/contract-fixtures/.*''',
  '''ops/posthog/dashboards/.*\.json$''',
]
regexes = [
  # Ключі сховища: snake_case або path-like, з обов'язковим роздільником усередині.
  # Приклади: nutrition_pantries_v1, routine/reminders/schedule
  '''^[a-z][a-z0-9]*([_/][a-z0-9]+)+$''',
  # Пароль тестового користувача Detox. Закомічений навмисно і давно, живе в
  # apps/mobile/src/auth/e2eAuthMock.ts і в обох detox-workflow. Це НЕ прод-секрет;
  # якщо колись заведеться однойменний користувач у проді - виняток прибрати.
  '''^detox-pass-\d{4}$''',
]
