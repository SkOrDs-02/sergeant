# Dependabot configuration for the Sergeant monorepo.
#
# **Per ADR-0103** (`docs/governance/adr/0103-dependabot-only-dependency-updates.md`)
# Dependabot — єдиний інструмент оновлення залежностей. Renovate на репо не
# встановлено, `renovate.json` видалено (ADR-0044 superseded). Гід для роботи
# з PR: `docs/engineering/integrations/dependabot-usage.md`.
#
# Scopes:
# - **npm** : щодня; security-оновлення однією групою `security-updates`,
#   звичайні оновлення версій — окремий PR на пакет.
# - **github-actions** : щотижня; оновлює дії, вже закріплені на SHA. Нову дію
#   пінуй на SHA вручну — Dependabot тег на SHA не переводить.
# - **docker** : щотижня; лише Dockerfile (`Dockerfile.api`, `ops/grafana-alloy`).
#   Digest `pgvector/pgvector` у `docker-compose.yml` і `services:` воркфлоу
#   сюди не входить — його піднімають вручну
#   (`docs/engineering/development/local-postgres-setup.md` § Bumping the SHA).
#
# Автомерджу немає: воркфлоу `dependabot-automerge.yml` у репо більше немає,
# кожен PR мерджить людина після зеленого CI.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Daily — security-updates повинні landed на наступному робочому дні
      # після disclosure, не чекати наступного понеділка (initiative 0008
      # Phase 3 vulnerability-window <24h target).
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # Груп для звичайних оновлень версій не налаштовано (ADR-0103): кожен
    # пакет приходить окремим PR. Пакети, що мусять іти разом (`@sentry/*`,
    # `@opentelemetry/*`), рев'юер підтягує вручну в тому ж PR.
    ignore:
      # Manual pins via pnpm.overrides in package.json — Dependabot must
      # not propose updates that fight the override pin. Keep this list in
      # sync with package.json:pnpm.overrides whenever overrides change.
      - dependency-name: "react-server-dom-webpack"
      - dependency-name: "tar"
      - dependency-name: "@xmldom/xmldom"
      - dependency-name: "serialize-javascript"
      - dependency-name: "postcss"
      - dependency-name: "uuid"
      - dependency-name: "@tootallnate/once"
      # Мажори, привʼязані до мобільного стеку (Expo SDK, React Native,
      # Capacitor). Їх ставлять разом із SDK (`expo install`), а не поодинці,
      # і мобільний контур на паузі (ADR-0094). Security-оновлення в межах
      # мажору ці правила не блокують. PR #878, #882, #1085 закрито з цієї
      # причини 2026-10-03.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor-mlkit/*"
        update-types: ["version-update:semver-major"]
    # Без власного `labels:` Dependabot ставить свої дефолтні мітки й сам їх
    # створює. Колишній список посилався на мітки, яких у репо немає
    # (`dependencies`, `automerge-eligible` — Dependabot скаржився в кожному
    # PR), а `security` чіплявся до ВСІХ npm-PR, зокрема звичайних оновлень
    # версій, і вводив в оману (розбір 2026-10-03).

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    commit-message:
      # `ci(deps)` lands the bump under the `ci` type (workflow change)
      # with the `deps` scope so commitlint scope-enum accepts it.
      prefix: "ci(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Проєкт закріплений на Node 22 LTS (Volta 22.19.0, рантайм
      # distroless nodejs22). Перехід на інший мажор — окреме рішення, а не
      # автооновлення (PR #1177 закрито 2026-10-03).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/ops/grafana-alloy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
