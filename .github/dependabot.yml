# Dependabot configuration for the Sergeant monorepo.
#
# **Per ADR-0044** (`docs/governance/adr/0044-renovate-vs-dependabot.md`) — Dependabot's
# scope is **security-only fallback**. Regular weekly bumps are owned by
# Renovate (`renovate.json`); Dependabot lifts security-updates daily so a
# CVE disclosed Tuesday lands in a PR Wednesday morning, not next Monday.
#
# Scopes kept here:
# - **npm** : security updates only, daily.
# - **github-actions** : SHA-pin rotation (overlap з Renovate `pinDigests:
#   true` навмисний — supply-chain integrity критична).
# - **docker** : same logic as github-actions.
#
# Scopes that used to live here (production-deps / dev-deps groups) belong
# to Renovate now; видалено щоб уникнути duplicate-PR-noise.
#
# Воркфлоу авто-мерджу (`dependabot-automerge.yml`) у репо більше немає.
#
# Увага (2026-10-03): Renovate на GitHub-репо зараз не працює (немає ні його
# PR, ні Dependency Dashboard), тож звичайні оновлення версій npm фактично
# приходять від Dependabot, попри ADR-0044. Вимикати їх тут
# (`open-pull-requests-limit: 0`) без працюючого Renovate не можна, бо тоді
# оновлень версій не буде зовсім. Це рішення власника.

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      # Daily — security-updates повинні landed на наступному робочому дні
      # після disclosure, не чекати наступного понеділка (initiative 0008
      # Phase 3 vulnerability-window <24h target).
      interval: "daily"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 10
    versioning-strategy: "increase"
    commit-message:
      prefix: "chore(deps)"
    groups:
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # Без `production-deps` / `dev-deps` groups — їх власник Renovate
    # (див. ADR-0044). Якщо Dependabot створить non-security PR з npm
    # ecosystem, це bug у налаштуванні і має бути закритий вручну з
    # коментарем «duplicate of Renovate group: <name>».
    ignore:
      # Manual pins via pnpm.overrides in package.json — Dependabot must
      # not propose updates that fight the override pin. Keep this list in
      # sync with package.json:pnpm.overrides whenever overrides change.
      - dependency-name: "react-server-dom-webpack"
      - dependency-name: "tar"
      - dependency-name: "@xmldom/xmldom"
      - dependency-name: "serialize-javascript"
      - dependency-name: "postcss"
      - dependency-name: "uuid"
      - dependency-name: "@tootallnate/once"
      # Мажори, привʼязані до мобільного стеку (Expo SDK, React Native,
      # Capacitor). Їх ставлять разом із SDK (`expo install`), а не поодинці,
      # і мобільний контур на паузі (ADR-0094). Security-оновлення в межах
      # мажору ці правила не блокують. PR #878, #882, #1085 закрито з цієї
      # причини 2026-10-03.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-native"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-test-renderer"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@capacitor-mlkit/*"
        update-types: ["version-update:semver-major"]
    # Без власного `labels:` Dependabot ставить свої дефолтні мітки й сам їх
    # створює. Колишній список посилався на мітки, яких у репо немає
    # (`dependencies`, `automerge-eligible` — Dependabot скаржився в кожному
    # PR), а `security` чіплявся до ВСІХ npm-PR, зокрема звичайних оновлень
    # версій, і вводив в оману (розбір 2026-10-03).

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    commit-message:
      # `ci(deps)` lands the bump under the `ci` type (workflow change)
      # with the `deps` scope so commitlint scope-enum accepts it.
      prefix: "ci(deps)"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Проєкт закріплений на Node 22 LTS (Volta 22.19.0, рантайм
      # distroless nodejs22). Перехід на інший мажор — окреме рішення, а не
      # автооновлення (PR #1177 закрито 2026-10-03).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/ops/grafana-alloy"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore(deps)"
