name: Nightly full audit + dependency check

# Owner: @SkOrDs-02 (solo maintainer).
# Triage: false-positive runs → close the auto-created issue з коментарем; reopen якщо повторюється > 2x за тиждень.
# Schedule rationale: див. https://github.com/Skords-01/Sergeant/blob/d068c73a2f21881d5c1305544fe99f3ea8be81f4/docs/90-work/initiatives/archive/_0009-agent-os-hardening.md § Phase 4 (PR 4.3 audit).

on:
  schedule:
    - cron: "0 3 * * *" # UTC 03:00 daily
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write
  actions: read

concurrency:
  group: nightly-audit
  cancel-in-progress: true

jobs:
  pnpm-audit-full:
    name: pnpm audit (full report)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Full audit (JSON)
        id: audit
        run: |
          set +e
          pnpm audit --json > pnpm-audit.json 2>&1
          AUDIT_EXIT=$?
          set -e

          CRITICAL=$(jq '[.advisories // {} | to_entries[] | select(.value.severity == "critical")] | length' pnpm-audit.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.advisories // {} | to_entries[] | select(.value.severity == "high")] | length' pnpm-audit.json 2>/dev/null || echo 0)

          echo "critical=${CRITICAL}" >> "$GITHUB_OUTPUT"
          echo "high=${HIGH}" >> "$GITHUB_OUTPUT"

          echo "### pnpm audit summary" >> "$GITHUB_STEP_SUMMARY"
          echo "| Severity | Count |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Critical | ${CRITICAL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| High | ${HIGH} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Audit exit code | ${AUDIT_EXIT} |" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audit report
        if: ${{ !cancelled() }}
        # actions/upload-artifact v7.0.0 (SHA-pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pnpm-audit-report
          path: pnpm-audit.json
          retention-days: 30

      - name: Fail on unwaived critical/high
        # Keep nightly aligned with the PR-time audit gate: critical
        # advisories always fail; high advisories fail unless a dated,
        # non-expired entry exists in docs/04-governance/security/audit-exceptions.md.
        run: node scripts/ci/audit-exceptions.mjs

  osv-scanner:
    name: OSV-Scanner dependency check
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # Потрібні для `pnpm audit` (severity) і `scripts/ci/osv-gate.mjs`.
      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Install osv-scanner v2.3.5 (checksum-pinned)
        # Дайджест — з `osv-scanner_SHA256SUMS` того ж релізу. Оновлюючи
        # версію, підстав новий хеш звідти, інакше крок впаде.
        run: |
          set -euo pipefail
          OSV_VERSION=2.3.5
          OSV_SHA256=bb30c580afe5e757d3e959f4afd08a4795ea505ef84c46962b9a738aa573b41b
          curl -fsSL \
            "https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}/osv-scanner_linux_amd64" \
            -o /tmp/osv-scanner
          echo "${OSV_SHA256}  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          sudo mv /tmp/osv-scanner /usr/local/bin/osv-scanner
          osv-scanner --version

      - name: Run osv-scanner
        id: scan
        # Код виходу зберігаємо, а не гейтимо тут: SARIF ще треба залити в
        # code-scanning і в артефакт. Гейт — окремий крок нижче.
        run: |
          set +e
          osv-scanner --format sarif --output osv-scanner.sarif --recursive ./
          SCAN_EXIT=$?
          set -e
          echo "exit_code=${SCAN_EXIT}" >> "$GITHUB_OUTPUT"

      - name: Upload SARIF to code-scanning
        if: ${{ !cancelled() }}
        # github/codeql-action/upload-sarif v4.36.0 (SHA-pinned)
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e
        with:
          sarif_file: osv-scanner.sarif

      - name: Upload SARIF artifact
        if: ${{ !cancelled() }}
        # actions/upload-artifact v7.0.0 (SHA-pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: osv-scanner-sarif
          path: osv-scanner.sarif
          retention-days: 30

      # Severity для гейта нижче. `pnpm audit` читає лише lockfile —
      # `pnpm install` не потрібен, тож це десятки секунд, а не хвилини, і
      # джоба лишається незалежною від `pnpm-audit-full` (обидві мають
      # догрузити SARIF у code-scanning навіть якщо сусідка впала).
      - name: Collect advisory severities (pnpm audit, lockfile-only)
        run: |
          set +e
          pnpm audit --json > pnpm-audit-severities.json 2>/dev/null
          set -e

      - name: Check for vulnerabilities (ledger-aware)
        # AI-CONTEXT: до 2026-08-23 цей крок валив джобу за БУДЬ-ЯКОГО
        # ненульового коду виходу сканера — тобто за будь-якої вразливості
        # будь-якої severity, включно з давно задокументованими в
        # `audit-exceptions.md`. Наслідок: джоба падала щоночі, `notify-failure`
        # щоночі оновлював issue «Nightly audit failure», і сигнал перестав
        # означати «щось НОВЕ зламалось» — той самий стан «червоний завжди =
        # вимкнений», що описаний в AGENTS.md § Performance budgets.
        #
        # Тепер гейт — `scripts/ci/osv-gate.mjs`: та сама ledger-політика, що
        # й у pnpm-лінії (`audit-exceptions.mjs`). Код виходу сканера далі
        # розрізняє «знайшов вразливості» (1) від «не зміг запуститись»
        # (127/128) — друге валить джобу негайно, бо нічого не перевірено.
        shell: bash
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          FINDINGS=$(jq '[.runs[]?.results[]?] | length' osv-scanner.sarif 2>/dev/null || echo 0)

          {
            echo "### OSV-Scanner summary"
            echo "- Scanner exit code: ${SCAN_EXIT}"
            echo "- SARIF results: ${FINDINGS}"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${SCAN_EXIT}" != "0" ] && [ "${SCAN_EXIT}" != "1" ]; then
            echo "::error::osv-scanner failed to run (exit ${SCAN_EXIT}) — nothing was verified"
            exit 1
          fi

          # `set +e` — щоб закрити ``` у summary навіть коли гейт валить
          # джобу; код виходу беремо з PIPESTATUS, а не з `tee`.
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          set +e
          node scripts/ci/osv-gate.mjs osv-scanner.sarif \
            --audit-json pnpm-audit-severities.json 2>&1 \
            | tee -a "$GITHUB_STEP_SUMMARY"
          GATE_EXIT=${PIPESTATUS[0]}
          set -e
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$GATE_EXIT"

  snyk:
    name: Snyk dependency check (optional)
    runs-on: ubuntu-latest
    # Контекст `secrets` заборонений у `jobs.<job_id>.if` — це робить весь
    # workflow file invalid (дивно, але GitHub mark-ить його як failed на
    # кожен push і **жодного разу не triggers schedule cron**). Тому job
    # запускається безумовно, а кожен step гейт-ить через `env.SNYK_TOKEN`.
    # Без секрета вся робота — `Skip if SNYK_TOKEN absent` (no-op step).
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - name: Skip if SNYK_TOKEN absent
        if: ${{ env.SNYK_TOKEN == '' }}
        run: |
          echo "SNYK_TOKEN is empty — skipping Snyk job (it is opt-in)."
          echo "### Snyk skipped" >> "$GITHUB_STEP_SUMMARY"
          echo "SNYK_TOKEN secret is not configured." >> "$GITHUB_STEP_SUMMARY"

      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: ${{ env.SNYK_TOKEN != '' }}

      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
        if: ${{ env.SNYK_TOKEN != '' }}

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: ${{ env.SNYK_TOKEN != '' }}
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        if: ${{ env.SNYK_TOKEN != '' }}
        run: pnpm install --frozen-lockfile

      - name: Install Snyk CLI
        if: ${{ env.SNYK_TOKEN != '' }}
        run: npm install -g snyk

      - name: Run Snyk test
        if: ${{ env.SNYK_TOKEN != '' }}
        run: snyk test --all-projects --severity-threshold=high --json-file-output=snyk-report.json || true

      - name: Upload Snyk report
        if: ${{ env.SNYK_TOKEN != '' && !cancelled() }}
        # actions/upload-artifact v7.0.0 (SHA-pinned)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: snyk-report
          path: snyk-report.json
          retention-days: 30

  notify-failure:
    name: Create/update issue on nightly audit failure
    needs: [pnpm-audit-full, osv-scanner, snyk]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      # actions/github-script v8.0.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const TITLE = 'Nightly audit failure';
            const MARKER = '<!-- nightly-audit-failure-marker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString().slice(0, 10);

            // Який саме лейн упав. Без цього issue казав лише «one or more
            // jobs failed» і читач мусив лізти в run, щоб дізнатись, чи це
            // pnpm-гейт, чи OSV, чи Snyk.
            const results = {
              'pnpm audit (ledger gate)': '${{ needs.pnpm-audit-full.result }}',
              'OSV-Scanner': '${{ needs.osv-scanner.result }}',
              'Snyk (optional)': '${{ needs.snyk.result }}',
            };
            const failed = Object.entries(results)
              .filter(([, r]) => r === 'failure')
              .map(([name]) => name);

            const body = [
              MARKER,
              `## Nightly audit failed — ${now}`,
              '',
              `**Workflow run:** ${runUrl}`,
              `**Failing job(s):** ${failed.length ? failed.map((n) => `\`${n}\``).join(', ') : '_none reported — check the run_'}`,
              '',
              '| Job | Result |',
              '| --- | ------ |',
              ...Object.entries(results).map(([name, r]) => `| ${name} | \`${r}\` |`),
              '',
              'Хоча б один лейн знайшов вразливість, якої немає в',
              '[`audit-exceptions.md`](../docs/04-governance/security/audit-exceptions.md)',
              '(або чий `Due date` минув). Тріаж — за',
              '[docs/04-governance/security/nightly-audit.md](../docs/04-governance/security/nightly-audit.md).',
              '',
              'Цей issue закривається **автоматично**, щойно всі три лейни стануть зеленими.',
              '',
              `> Auto-generated by \`nightly-audit.yml\`. Last updated: ${new Date().toISOString()}.`,
            ].join('\n');

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-audit-failed,security',
              state: 'open',
              per_page: 10,
            });

            const existing = issues.find((i) => i.title === TITLE && i.body?.includes(MARKER));

            if (existing) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
              core.info(`Updated existing issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: TITLE,
                body,
                labels: ['nightly-audit-failed', 'security'],
              });
              core.info(`Created issue #${created.data.number}`);
            }

  notify-recovered:
    name: Close the nightly-audit issue when every lane is green
    needs: [pnpm-audit-full, osv-scanner, snyk]
    if: ${{ success() }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      # AI-CONTEXT: до 2026-08-23 alert-workflow-и вміли лише ВІДКРИВАТИ
      # issue — жоден не закривав його після відновлення. Односторонній
      # храповик: issue лишався відкритим ще довго після того, як причина
      # зникла, і читач більше не міг відрізнити «болить зараз» від
      # «боліло колись». Цей job — відсутня друга половина.
      #
      # actions/github-script v8.0.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const TITLE = 'Nightly audit failure';
            const MARKER = '<!-- nightly-audit-failure-marker -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'nightly-audit-failed,security',
              state: 'open',
              per_page: 10,
            });

            const existing = issues.find(
              (i) => i.title === TITLE && i.body?.includes(MARKER),
            );
            if (!existing) {
              core.info('No open nightly-audit issue — nothing to close.');
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              body: [
                `### Recovered — ${new Date().toISOString().slice(0, 10)}`,
                '',
                `Усі три лейни nightly-audit пройшли: ${runUrl}`,
                '',
                'Закрито автоматично. Якщо вразливість повернеться, workflow',
                'відкриє новий issue.',
              ].join('\n'),
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: existing.number,
              state: 'closed',
              state_reason: 'completed',
            });
            core.info(`Closed issue #${existing.number}`);
