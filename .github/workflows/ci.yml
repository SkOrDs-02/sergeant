        run: pnpm --filter @sergeant/db-schema build

      - name: Run server integration suite
        run: pnpm --filter @sergeant/server test:integration

  rag-eval:
    name: RAG eval gate (cached embeddings)
    runs-on: ubuntu-latest
    # Окрема джоба, а не крок у `check` — свідомо. `size-limit` колись
    # стояв кроком ПІСЛЯ «Format, lint, test, build», і коли той червонів,
    # бюджетний гейт просто не виконувався: у логах це виглядало не як
    # «бюджет перевищено», а як тиша (AGENTS.md § Performance budgets).
    # Гейт, що стоїть після потенційно червоного кроку, не є гейтом.
    #
    # Мережі тут немає: вектори лежать у фікстурі, а пошук справжній —
    # той самий pgvector, HNSW і `vectorStore.query`, що в проді.
    timeout-minutes: 20
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @sergeant/db-schema
        # Без цього кроку імпорт `drizzle.ts` падає з ERR_MODULE_NOT_FOUND —
        # той самий крок є у server-integration і critical-flow.
        run: pnpm --filter @sergeant/db-schema build

      - name: Corpus is reproducible from seed
        run: pnpm eval:rag-corpus:check

      - name: Run RAG eval gate
        run: pnpm --filter @sergeant/server test:rag-eval

  tool-eval:
    name: Tool eval gate (recorded cassette)
    runs-on: ubuntu-latest
    # Окрема джоба з тієї самої причини, що й rag-eval: гейт, який стоїть
    # кроком після потенційно червоного кроку, не є гейтом — він просто не
    # виконується і мовчить (AGENTS.md § Performance budgets).
    #
    # Мережі тут немає й ключів не треба: відповіді моделі лежать у касеті,
    # записаній вручну через `pnpm eval:tools --record`. Джоба міряє НЕ модель
    # (вона в записі зафіксована), а код навколо неї: системний промпт, схеми
    # інструментів, оцінювання, сценарії ланцюжків. Дрейф самої моделі — інше
    # питання й інший прогін.
    timeout-minutes: 10
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tool eval gate
        run: pnpm --filter @sergeant/server test:tool-eval

  # openclaw-config-schema retired 2026-07-21 — OpenClaw Gateway fully
  # decommissioned (ADR-0075). Dockerfile.openclaw-gateway, ops/openclaw/,
  # and scripts/validate-openclaw-config.mjs are gone; keeping the job would
  # ENOENT on every push to main.

  migration-lint:
    name: Migration lint (AGENTS rule #4)
    runs-on: ubuntu-latest
    # Свідомо БЕЗ `if: github.event_name == 'pull_request'` (на відміну від
    # решти PR-only джоб): дубль 091 у 2026-07-31 проліз саме тому, що обидва
    # PR-и лінтувались проти `main`, на якому тоді був максимум 090 — жоден із
    # прогонів не бачив другого файлу, а після мержу гейт більше не запускався
    # ніде. Прогін на push у `main` ловить таку колізію в межах хвилини після
    # мержу, замість того щоб вона спливла в продовій діагностиці. На push
    # `github.base_ref` порожній → BASE_REF падає в дефолт "main", diff проти
    # origin/main порожній, і лишаються рівно whole-tree перевірки (gaps +
    # duplicates) — саме те, що тут потрібно.
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Lint migration files
        run: node scripts/lint-migrations.mjs
        env:
          BASE_REF: ${{ github.base_ref }}

  migration-down-drill:
    name: Migration down drill (AGENTS rule #4)
    # PR-32 (`docs/90-work/planning/archive/pr-plan-2026-05.md`). Static lint above guarantees
    # sequential numbering + two-phase DROP, but down-migrations themselves
    # are not validated by the linter — they could `DROP COLUMN` a column
    # that no longer exists or forget a sequence created in the up, and the
    # bug only surfaces during an emergency local rollback. This job runs
    # `scripts/migration-down-drill.mjs` against a fresh pgvector container:
    # apply all ups → apply every `.down.sql` in reverse → re-apply all ups
    # → fingerprint-compare the two end states. Any drift fails the build.
    runs-on: ubuntu-latest
    timeout-minutes: 8

    services:
      # Same image as `critical-flow` / `coverage` — migration 025 needs
      # pgvector, and SHA-pinning matches docker-compose.yml so local +
      # CI drills run against an identical binary.
      postgres:
        image: pgvector/pgvector:pg17@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d hub"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hub:hub@127.0.0.1:5432/hub

    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        # `pg` is hoisted to the workspace root via pnpm — the drill script
        # at `scripts/migration-down-drill.mjs` resolves it from
        # `node_modules/pg` without a workspace filter.
        run: pnpm install --frozen-lockfile

      - name: Pure-helper unit tests
        # Cheap pre-flight: validates `downCompanion` / `diffSnapshots` so
        # a broken helper fails fast before we spin up the integration drill.
        run: node --test scripts/__tests__/migration-down-drill.test.mjs

      - name: Run migration down drill
        run: pnpm db:drill:down

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action v2.3.9 (SHA-pinned for supply-chain hardening)
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Catches GitHub Actions YAML mistakes that GitHub silently fails on
    # (e.g. `secrets` context in `jobs.<job_id>.if`, which makes the entire
    # workflow file invalid and prevents schedule cron triggers from firing).
    # actionlint runs locally — no network calls beyond the binary download.
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Install actionlint v1.7.7 (checksum-pinned)
        run: |
          set -euo pipefail
          ACTIONLINT_VERSION=1.7.7
          ACTIONLINT_SHA256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            -o /tmp/actionlint.tar.gz
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          sudo mv /tmp/actionlint /usr/local/bin/actionlint
          actionlint --version

      - name: Lint .github/workflows
        # `-ignore` filters out shellcheck info/style noise from existing run
        # scripts (SC2012, SC2016, SC2129 …) so the gate stays focused on
        # workflow-schema and expression errors — e.g. the `secrets` context
        # in `jobs.<job_id>.if` that caused this PR. shellcheck `error`/
        # `warning` levels still fail the job.
        run: |
          actionlint -color \
            -ignore 'shellcheck reported issue in this script: SC[0-9]+:(info|style):'

  pipeline-duration-summary:
    name: Pipeline duration (p95 trend)
    runs-on: ubuntu-latest
    # Run after all main jobs; report even when some fail.
    needs: [check, coverage, a11y, critical-flow, mobile-ui-audit]
    if: always()
    permissions:
      contents: read
      pull-requests: write
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"

      - name: Compute pipeline duration metrics
        id: metrics
        run: node scripts/ci/pipeline-duration-p95.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Post or update PR comment
        # Only on pull_request events from the same repo (not forks).
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        # actions/github-script v8.0.0 (SHA-pinned for supply-chain hardening)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = '<!-- ci-pipeline-duration-summary -->';
            const body = `${process.env.REPORT_BODY}`;
            if (!body || !body.includes(marker)) {
              console.log('No report body found, skipping comment.');
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              console.log('Created new comment');
            }
        env:
          REPORT_BODY: ${{ steps.metrics.outputs.markdown }}
