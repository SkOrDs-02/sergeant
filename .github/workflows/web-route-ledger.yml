name: Web route ledger

# Owner: @SkOrDs-02 (solo maintainer).
# Що це: 49 route-кейсів у `apps/web/tests/ledger/user-story-ledger.spec.ts`
#        (`playwright.ledger.config.ts`) — кожен web-маршрут відкривається на
#        прод-білді з повністю замоканим `**/api/**`, і перевіряється, що
#        корінь застосунку відрендерився, а в консолі/`pageerror` немає
#        фатальних помилок.
# Навіщо: це єдиний лейн, що ловить клас white-screen-регресій НА БУТІ —
#        коли перекроєні eager-чанки стартують analytics з ще не
#        ініціалізованими константами і застосунок не рендериться взагалі.
#        Typecheck і юніти цього не бачать (задокументований прецедент
#        `AuthContext × @sergeant/shared` — apps/web/AGENTS.md § Surface-
#        specific gotchas). Підключення в nightly — рекомендація #2 з
#        `docs/90-work/audits/2026-08-04-test-coverage-depth-audit.md`
#        («або в nightly, або видалити»); власник обрав підключити.
# Visibility: червоний CRON-прогін створює/оновлює ІДЕМПОТЕНТНУ issue
#        (джоба `report-red-run` нижче) — той самий патерн, що в
#        `mutation-testing.yml` / `pact-drift.yml` / `db-backup-verify.yml`,
#        щоб провал не лежав непоміченим до наступного погляду в Actions.
# Розклад: 01:00 UTC щодня — вільний слот між уже зайнятими кронами
#        (extended-e2e 02:00, nightly-audit 03:00, container-scan 04:00,
#        pact-drift 06:00, post-deploy-smoke 06:30), щоб не конкурувати за
#        ранери з іншими nightly-лейнами.

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-route-ledger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  route-ledger:
    name: Web route ledger (Playwright)
    runs-on: ubuntu-latest
    # Білд web (~4-6 хв на деградованих ранерах) + 49 послідовних кейсів
    # (`workers: 1` у конфізі). 30 хв страхують від зависання, а не карають
    # за повільний ранер — та сама логіка, що в `ci.yml > critical-flow`.
    timeout-minutes: 30

    # Ані Postgres, ані API-сервер тут НЕ потрібні: спека мокає `**/api/**`
    # повністю (`route.fulfill` на кожен запит), а `playwright.ledger.config.ts`
    # сам піднімає webServer (`npm run build && npm run preview`). VERCEL
    # навмисно НЕ виставлений (на відміну від `lighthouse-ci.yml`): і білд, і
    # `vite preview` мають резолвити один і той самий outDir `../server/dist`
    # (див. `apps/web/vite.config.js`) — те саме, що робить `mobile-ui-audit`.
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @sergeant/db-schema
        # Web-бандл імпортує `@sergeant/db-schema/sqlite`, і exports-мапа
        # пакета резолвить це у `dist/` — без цього кроку білд падає на
        # резолві. Дешево (~5 s, лише tsc) і скіпається на remote-cache hit.
        # Той самий крок є в `ci.yml > critical-flow` / `mobile-ui-audit`.
        run: pnpm --filter @sergeant/db-schema build

      - name: Get Playwright version
        id: pw-version
        run: echo "version=$(pnpm --filter @sergeant/web exec playwright --version | head -1)" >> "$GITHUB_OUTPUT"

      # actions/cache v5.0.5 (SHA-pinned for supply-chain hardening)
      - name: Cache Playwright browsers
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw-version.outputs.version }}

      - name: Install Playwright Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @sergeant/web exec playwright install --with-deps chromium

      - name: Install Playwright system deps (cached browsers)
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @sergeant/web exec playwright install-deps chromium

      - name: Run web route ledger suite
        # `webServer` у `playwright.ledger.config.ts` сам виконує
        # `npm run build && npm run preview -- --port 4173` (timeout 360 s),
        # тому окремих build/preview кроків тут нема. Конфіг оголошує рівно
        # один project (`chromium`), тож `--project` не потрібен.
        run: pnpm --filter @sergeant/web e2e:ledger
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        # actions/upload-artifact v7.0.0 (SHA-pinned for supply-chain hardening)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          # `reporter: [["list"], ["html", { open: "never" }]]` — html-репорт
          # лягає у дефолтний `apps/web/playwright-report`, трейси і скріншоти
          # провалених кейсів — у `apps/web/test-results` (`trace:
          # retain-on-failure`, `screenshot: only-on-failure`).
          name: playwright-web-route-ledger-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  report-red-run:
    name: Create / refresh issue on red run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [route-ledger]
    # Спрацьовує, коли лейн падає на нічному кроні. Ручні
    # `workflow_dispatch`-прогони дивиться людина, тож issue вони не
    # відкривають — дзеркалить гейт `github.event_name == 'schedule'` у
    # `mutation-testing.yml` / `pact-drift.yml`.
    if: always() && contains(needs.*.result, 'failure') && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create / refresh web-route-ledger issue
        # actions/github-script v8.0.0 (SHA-pinned for supply-chain hardening)
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const date = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `[Route ledger] Nightly web route ledger is red — ${date}`;
            const body = [
              '## Nightly web route ledger run failed',
              '',
              `**Run:** ${runUrl}`,
              `**Date:** ${new Date().toISOString()}`,
              `**Triggered by:** \`${context.eventName}\` (cron 01:00 UTC daily)`,
              '',
              'Червоний кейс означає одне з двох: маршрут не відрендерив',
              'корінь застосунку за 15 s, або на буті сипнули фатальні',
              'console-помилки / `pageerror`. Це рівно той клас',
              'white-screen-регресій, який НЕ бачать typecheck і юніти',
              '(прецедент `AuthContext × @sergeant/shared` —',
              '`apps/web/AGENTS.md` § Surface-specific gotchas).',
              '',
              'Triage:',
              '',
              '1. Відкрий run вище → артефакт `playwright-web-route-ledger-report`',
              '   (`playwright-report/index.html` + трейси у `test-results/`).',
              '2. Знайди перший червоний `WEB-*` кейс — у повідомленні тесту',
              '   лежить масив зібраних browser-помилок для цього маршруту.',
              '3. Відтвори локально:',
              '   `pnpm --filter @sergeant/web e2e:ledger`',
              '   (конфіг сам робить build + `vite preview`; Postgres і API-сервер',
              '   не потрібні — `**/api/**` замокано у спеці).',
              '4. НЕ гаси лейн фільтром помилок і не звужуй список маршрутів,',
              '   щоб зробити джобу зеленою — це рішення власника, не хотфікс.',
              '',
              'cc @SkOrDs-02',
            ].join('\n');

            // Ідемпотентно: оновлюємо наявну відкриту issue замість того, щоб
            // плодити нову щоночі. Той самий патерн, що в mutation-testing.yml /
            // pact-drift.yml / db-backup-verify.yml.
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'web-route-ledger',
              per_page: 100,
            });
            const existing = issues.find((i) =>
              i.title.startsWith('[Route ledger]'),
            );

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: [
                  `### Re-detected on ${date}`,
                  '',
                  `**Run:** ${runUrl}`,
                ].join('\n'),
              });
              core.info(`Updated existing issue #${existing.number}.`);
            } else {
              const created = await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['web-route-ledger', 'tech-debt'],
              });
              core.info(`Created new issue #${created.data.number}.`);
            }
