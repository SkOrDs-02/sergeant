name: RAG eval (live embeddings)

# Живий вимір: ті самі корпус, запити, pgvector і topK, що в
# блокувальному гейті — але вектори беруться з Voyage просто зараз.
# Тому дельта між цим прогоном і кешованим означає рівно одне: Voyage
# змінився під нами, а не наш код зламався.
#
# Цей workflow нічого не блокує і нічого не гасить — він алертить.
# Автоматичне перемикання kill-switch свідомо вимкнене: `activateKillSwitch`
# тримається в памʼяті процесу, тобто вимикач бреше про своє ввімкнення.
#
# Вартість — близько $0.0012 за прогін ($0.06 на рік).

on:
  schedule:
    # Понеділок, 06:00 UTC — до початку робочого тижня.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-eval:
    name: Live embeddings vs baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v6.0.2 (SHA-pinned for supply-chain hardening)
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      # pnpm/action-setup v6.0.3 (SHA-pinned for supply-chain hardening)
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093

      # actions/setup-node v6.4.0 (SHA-pinned for supply-chain hardening)
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @sergeant/db-schema
        run: pnpm --filter @sergeant/db-schema build

      - name: Run live eval
        env:
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        # Exit code 1 = warn, 2 = kill. Живий шар не блокує нічого, тому
        # прогін завжди «успішний»; сигнал читається зі звіту й гейджів.
        run: |
          pnpm --filter @sergeant/server rag-eval:live -- --output=rag-eval-live.json || true

      # actions/upload-artifact v7.0.0 (SHA-pinned)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rag-eval-live-report
          path: apps/server/rag-eval-live.json
          if-no-files-found: warn
          retention-days: 30
