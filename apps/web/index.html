<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <!--
      `interactive-widget=resizes-content` — when iOS Safari (or any
      browser that honours the proposed `interactive-widget` attr)
      shows the soft keyboard, the layout viewport shrinks instead of
      sliding under the keyboard. Without it, fixed-position sheets
      like ManualExpenseSheet and HubChat have their inputs covered by
      the keyboard. Pairs with `viewport-fit=cover` so the content
      still reaches the safe-area edges when the keyboard is hidden.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <!--
      L3 — `docs/security/hardening/L3-meta-referrer.md`. Vercel sends
      `Referrer-Policy: strict-origin-when-cross-origin` from `vercel.json`
      headers. The duplicate `<meta name="referrer">` is defense-in-depth
      so the same policy still applies if the page is ever served without
      Vercel's response headers (file://, local Vite preview, dev proxy
      that strips headers). Keep it in sync with `vercel.json`.
    -->
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <!--
      Values must track `--c-bg` in `src/styles/theme.css` (`:root` /
      `.dark`) — #ecebe7 light / #14100e dark. These media-query metas are
      only the pre-JS default (first paint before `useTheme()` mounts);
      once the app boots, `useTheme.ts` `applyResolvedTheme()` overwrites
      both with the actually-resolved theme so an in-app light/dark/hc
      pick (which can diverge from the OS `prefers-color-scheme`) is
      reflected in the browser chrome too.
    -->
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#ecebe7"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#14100e"
    />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      Defense-in-depth fallback for the production CSP. The canonical policy
      lives in the `apps/web/vercel.json` `headers[*]` block (see
      `docs/04-governance/security/hardening/C2-frontend-csp.md`); a Vercel header always
      wins over a `<meta http-equiv>` tag, so this duplicate is invisible
      under normal conditions.

      It only kicks in when the page is loaded WITHOUT the Vercel headers —
      e.g. opened from disk via `file://`, served from a local Vite preview
      that hasn't replicated the Vercel config, or proxied through a
      development tool that strips response headers. In every one of those
      cases the SPA still loads in a CSP-protected context, so an XSS
      payload that slips into a dev build can't quietly exfiltrate data.

      Note: `<meta>` CSP cannot include `report-uri` / `report-to` /
      `frame-ancestors` / `sandbox` (HTML spec restriction), so the directive
      set here is a reduced subset of the Vercel policy. Keep the two in
      sync when the Vercel policy changes.

      "Reduced subset" must mean FEWER directives, never WEAKER ones. Until
      the beta-readiness audit
      (`docs/90-work/planning/specs/beta-security-readiness.md`, F4) this tag
      still carried `script-src 'unsafe-inline'` after the Vercel policy had
      dropped it — so the fallback that exists for the least-protected
      contexts (file://, stripped headers, local preview) was the most
      permissive policy we shipped. `'unsafe-inline'` is gone from both now.

      `wss:`/`ws:` were also removed: `apps/web` opens no WebSocket at all,
      so the wildcard was pure attack surface. Only the local-dev HMR origins
      remain here, and they are absent from the production header.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-/Fha0pr46W0sUDHj92uMDOsjb2l01wtbzajcFGo5JEU=' https://*.posthog.com https://*.sentry-cdn.com https://*.sentry.io https://js.sentry-cdn.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 https://*.sentry.io https://*.ingest.sentry.io https://*.posthog.com https://api.sergeant.com.ua ws://localhost:* ws://127.0.0.1:*; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'"
    />
    <title>Sergeant · гроші, тренування, звички і їжа</title>
    <!--
      S10-R1 (sprint-9-10-plan-2026.md § Sprint 10) — OG/Twitter meta for
      link-preview crawlers. Static tags in index.html rather than a
      per-route head library: `/` (LandingPage) is the only public
      pre-auth surface, crawlers read the initial HTML without executing
      JS, and no react-helmet-like mechanism exists in this app (see
      RootLayout.tsx's `document.title` effect for the in-app pattern).
      og:image falls back to the PWA icon — no dedicated 1200x630 social
      card asset exists yet in apps/web/public; add one and swap this if
      a real social-share card is needed later.

      Домен тут — `app.sergeant.com.ua`, той самий, що в `public/robots.txt`
      і `public/sitemap.xml`. До 2026-09-17 стояв `sergeant.app`: домен
      проєкту не належить і віддає паркувальну сторінку з редиректом на
      `/lander`, тож кожне прев'ю посилання в Telegram чи соцмережах тягло
      мертву картинку і чужий canonical. Міняєш домен — міняй у трьох
      файлах разом.
    -->
    <meta
      name="description"
      content="Sergeant обʼєднує чотири модулі (Фінік, Фізрук, Їжа, Рутина) в один local-first помічник з AI, без прихованих платежів."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sergeant" />
    <meta
      property="og:title"
      content="Sergeant · гроші, тренування, звички і їжа"
    />
    <meta
      property="og:description"
      content="Один помічник для фінансів, тренувань, харчування і рутини. Local-first, з AI, без прихованих платежів."
    />
    <meta
      property="og:image"
      content="https://app.sergeant.com.ua/icon-512.png"
    />
    <meta property="og:url" content="https://app.sergeant.com.ua/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sergeant · гроші, тренування, звички і їжа"
    />
    <meta
      name="twitter:description"
      content="Один помічник для фінансів, тренувань, харчування і рутини. Local-first, з AI, без прихованих платежів."
    />
    <meta
      name="twitter:image"
      content="https://app.sergeant.com.ua/icon-512.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <!--
      Без JS застосунок не працює: local-first сховище і sync живуть у
      браузері. До 2026-09-17 при вимкненому JS або зламаному бандлі
      (застарілий service worker, заблокований скрипт) лишалась порожня
      сторінка без жодного пояснення. Inline-style дозволений CSP
      (`style-src 'unsafe-inline'` і в meta вище, і у vercel.json).
    -->
    <noscript>
      <div
        style="
          max-width: 32rem;
          margin: 4rem auto;
          padding: 0 1.5rem;
          font:
            16px/1.5 system-ui,
            -apple-system,
            sans-serif;
          color: #14100e;
        "
      >
        <h1 style="font-size: 1.25rem; margin: 0 0 0.75rem">
          Sergeant не працює без JavaScript
        </h1>
        <p style="margin: 0 0 0.75rem">
          Застосунок тримає дані на цьому пристрої і синхронізує їх лише через
          браузерний код. Увімкни JavaScript або відкрий сторінку в іншому
          браузері.
        </p>
        <p style="margin: 0">
          Якщо JavaScript увімкнено, а ти бачиш цей текст, бандл не
          завантажився. Онови сторінку: вона підтягне свіжу збірку.
        </p>
      </div>
    </noscript>
    <!--
      Сторож білого екрана (DURABILITY-20261008-BOOT-1). INLINE навмисно: це
      був зовнішній `/boot-watchdog.js`, але у знайденому збої підресурси
      нового документа зависають у fetch-диспетчері активного service worker,
      тож зовнішній скрипт висів разом з усім (і чекав `load`, якого не буде).
      Інлайн виконується без мережі. Через 10 с (повільна 3G-холодна загрузка
      монтується за 5-6 с, зависання ж безстрокове, ≥15 с у знімках) перевіряє
      `#root`; якщо порожній — тягне знімок fetch-буфера SW (`SW_FETCH_DIAG`,
      1.5 с на відповідь), кладе звіт у sessionStorage (його шле в Sentry
      наступний бут, `bootWatchdogReport.ts`) і лікує: при контрольованій
      сторінці, що не вийшла з `loading` або має завислі SW-fetch, знімає
      реєстрації SW і перезавантажує (обхід SW), інакше простий reload. Мітка
      `sergeant.boot_watchdog_at` — не частіше раз на хвилину; без sessionStorage
      лікування не робиться (щоб не зациклитись).

      CSP: хеш цього тіла (`sha256-…`) стоїть у `script-src` і в `<meta>`
      нижче, і в `vercel.json`. ЗМІНИВ ТЕКСТ СКРИПТА — онови обидва; синхронність
      тримає `src/core/lib/bootWatchdog.test.ts` (друкує новий хеш).
    -->
    <!-- prettier-ignore -->
    <script>
(function(){var K="sergeant.boot_watchdog_at",R="sergeant.boot_watchdog_report";setTimeout(function(){var r=document.getElementById("root");if(!r||r.childElementCount>0)return;var c=navigator.serviceWorker&&navigator.serviceWorker.controller,done=0;function fin(s){if(done)return;done=1;var rs=document.readyState,t=Date.now(),a="none",ok=0;try{var l=Number(sessionStorage.getItem(K)||0);if(t-l>=6e4){sessionStorage.setItem(K,String(t));ok=1}}catch(e){}if(ok)a=c&&(rs==="loading"||s&&s.pending>0)?"bypass":"reload";try{sessionStorage.setItem(R,JSON.stringify({at:t,rs:rs,ctl:!!c,act:a,snap:s||null}))}catch(e){}if(a==="none")return;if(a==="reload"){location.reload();return}var g=function(){location.reload()};setTimeout(g,2e3);try{navigator.serviceWorker.getRegistrations().then(function(x){return Promise.all(x.map(function(y){return y.unregister()}))}).then(g,g)}catch(e){g()}}if(!c)return fin();try{var m=new MessageChannel;m.port1.onmessage=function(e){fin(e.data&&e.data.snapshot)};setTimeout(fin,1500);c.postMessage({type:"SW_FETCH_DIAG"},[m.port2])}catch(e){fin()}},1e4)})();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
