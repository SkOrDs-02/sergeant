          { name: duration_min, type: integer, required: false },
        ],
    }
  - {
      name: nutrition_meal_logged,
      category: value_loop,
      source: frontend,
      description: "Назва страви у payload НЕ передається.",
      properties: [
          { name: after_signal, type: boolean, required: true },
          { name: ms_since_signal, type: integer, required: false },
          { name: signal, type: string, required: false },
          {
            name: meal_type,
            type: string_enum,
            required: true,
            values: [breakfast, lunch, dinner, snack, unknown],
          },
          {
            name: source,
            type: string_enum,
            required: true,
            values: [manual, photo],
            description: "Як їжа потрапила в лог.",
          },
          {
            name: macro_source,
            type: string_enum,
            required: true,
            values: [manual, productDb, photoAI, recipeAI],
            # camelCase тут НЕ описка й не підлягає нормалізації у snake_case:
            # це дослівні доменні літерали `Meal.macroSource` з
            # @sergeant/nutrition-domain (normalizeMeal). Перейменування тут
            # розсинхронізувало б подію з полем, яке її наповнює.
            description: "Звідки макроси. Інша вісь, ніж source: фото без розпізнаних макросів = photo + manual.",
          },
