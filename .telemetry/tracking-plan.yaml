            name: source,
            type: string_enum,
            required: true,
            values: [coach_insight, weekly_digest],
          },
          {
            name: surface,
            type: string_enum,
            required: true,
            # Дзеркалить `AdviceSurface` з
            # apps/web/src/core/observability/adviceTelemetry.ts. Тримати
            # синхронно: вільний `string` тут дозволив би одрук у поверхні,
            # який мовчки розділив би один зріз на два.
            values: [hub_dashboard, hub_reports],
          },
          {
            name: day_key,
            type: date,
            required: true,
            format: YYYY-MM-DD,
            description: "День ПРИСТРОЮ (ADR-0078), не UTC.",
          },
          {
            name: chars,
            type: integer,
            required: true,
            description: "Довжина поради. Сам текст у payload відсутній (Hard Rule #21).",
          },
          {
            name: instrumentation_version,
