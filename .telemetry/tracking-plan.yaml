  # AI-порада: показ + реакція. Тіло поради НЕ існує на рівні події.
  - {
      name: ai_advice_shown,
      category: value_loop,
      source: frontend,
      description: "AI-порада фактично видима користувачу (не просто змонтована). advice_id — випадковий uuid, НЕ хеш тексту.",
      properties: [
