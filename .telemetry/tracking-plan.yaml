  # ─────────────────────────────────────────────────────────────────────
  # VALUE LOOPS (NEW — Хвиля 2: «сигнал показано → дію зроблено»)
  #
  # Джерело: docs/90-work/planning/product-knowledge-backlog.md § Хвиля 2.
  # Стан: імена ЗАМОРОЖЕНІ в packages/shared/src/lib/analyticsEvents.valueLoops.ts
  # і пінуються verbatim у analyticsEvents.test.ts. Реєстрація тут навмисно
  # випередила інструментування (щоб audit-прогін не позначив ці події як
  # undesigned drift); станом на кінець Хвилі 2 web-callsite-и мають усі 10 —
  # див. таблиці в .telemetry/delta.md. Без callsite-ів лишились лише
  # mobile-дзеркала.
  #
  # PII-контракт групи: НІЯКОГО вільного тексту. Тіло AI-поради, назви
  # звичок / страв, сирі insight id (несуть categoryId кастомної категорії)
  # у payload не потрапляють. scrubPII чистить за ІМЕНАМИ ключів
  # (packages/shared/src/lib/pii.ts), тож він тут НЕ страхує — захист є
  # контрактом (Hard Rule #21).
  #
  # Вікно атрибуції N у код НЕ зашите: події несуть сирий ms_since_signal,
  # а N обирається в PostHog-запиті й переглядається заднім числом.
  #
  # ІНСТРУМЕНТОВАНО 2026-07-25. Єдиний писар трьох value_signal_* —
  # apps/web/src/shared/components/ui/InsightCard.tsx (mount / activate /
  # dismiss). НЕ додавай emit у use*Insight.ts-хуки: вони рендеряться через
  # InsightCard, тож подія полетить двічі. `module` і `signal` виводяться
  # з insight id через apps/web/src/shared/lib/insights/insightId.ts —
  # явний реєстр kind-ів, longest-prefix match.
  #
  # `module: unknown` у enum — це НЕ покриття помилки, а видимий бакет для
  # сигналу, якого немає в реєстрі insightId.ts. Краще одна порожня
  # категорія на дашборді, ніж тихе розмиття знаменника відомих модулів.
  # ─────────────────────────────────────────────────────────────────────
  - {
      name: value_signal_shown,
      category: value_loop,
      source: frontend,
      description: "Продуктовий сигнал (insight-картка) показано користувачу. Спільний шов InsightCard покриває всі модулі.",
      properties:
        [
          {
            name: module,
            type: string_enum,
            required: true,
            values: [finyk, fizruk, routine, nutrition, unknown],
          },
          {
            name: signal,
            type: string,
            required: true,
            description: "Стабільний kind БЕЗ змінного суфікса (finyk-budget-overrun, НЕ finyk-budget-overrun-<categoryId>). High-cardinality / PII guard.",
          },
          {
            name: surface,
            type: string_enum,
            required: true,
            values: [module, hub],
          },
        ],
    }
  - {
      name: value_signal_activated,
      category: value_loop,
      source: frontend,
      description: "Користувач натиснув основну дію сигналу.",
      properties:
