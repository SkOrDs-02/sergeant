          { name: ms_since_signal, type: integer, required: false },
          { name: signal, type: string, required: false },
          { name: saw_streak_surface, type: string, required: false },
          { name: streak_days_at_checkin, type: integer, required: false },
          { name: ms_since_streak_shown, type: integer, required: false },
