          {
            name: module,
            type: string_enum,
            required: true,
            values: [finyk, fizruk, routine, nutrition, unknown],
          },
          { name: signal, type: string, required: true },
          {
            name: surface,
            type: string_enum,
            required: true,
            values: [module, hub],
          },
