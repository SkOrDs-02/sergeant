  - {
      name: finyk_tx_categorized,
      category: value_loop,
      source: frontend,
      description: "Єдина відсутня дія finyk; expense_added / budget_set переюзуються як є (до них лише дописані поля атрибуції).",
      properties:
        [
          { name: after_signal, type: boolean, required: true },
